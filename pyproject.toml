[project]
name = "residencial-aurora-assistente"
version = "0.1.0"
description = "Assistente virtual do Residencial Aurora, construído com Google ADK e exposto por uma API FastAPI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk==2.9.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
